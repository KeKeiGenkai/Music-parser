

name: Deploy (self-hosted)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy (git pull + build + start container)
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          cd "$DEPLOY_PATH"
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          bash scripts/deploy.sh
